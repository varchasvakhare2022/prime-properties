<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Dark Background with subtle gradient -->
  <rect width="256" height="256" fill="#0a0a0a" rx="48"/>
  <rect width="256" height="256" fill="url(#gradient)" rx="48" opacity="0.3"/>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#c4941f;stop-opacity:0.15" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c4941f;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Luxury House Icon -->
  <g transform="translate(128, 128)">
    <!-- Roof -->
    <path d="M -60 -20 L 0 -70 L 60 -20 L 50 -20 L 50 -10 L -50 -10 L -50 -20 Z" 
          fill="url(#goldGradient)" 
          stroke="#ffd700" 
          stroke-width="2"
          filter="url(#glow)"/>
    
    <!-- Main House Body -->
    <rect x="-50" y="-10" width="100" height="70" 
          fill="#1a1a1a" 
          stroke="url(#goldGradient)" 
          stroke-width="3"/>
    
    <!-- Door -->
    <rect x="-15" y="20" width="30" height="40" 
          fill="url(#goldGradient)" 
          rx="2"/>
    
    <!-- Windows -->
    <rect x="-42" y="5" width="20" height="20" 
          fill="#d4af37" 
          stroke="#ffd700" 
          stroke-width="1.5"
          opacity="0.9"/>
    <rect x="22" y="5" width="20" height="20" 
          fill="#d4af37" 
          stroke="#ffd700" 
          stroke-width="1.5"
          opacity="0.9"/>
    
    <!-- Window Cross Bars -->
    <line x1="-32" y1="5" x2="-32" y2="25" stroke="#1a1a1a" stroke-width="1.5"/>
    <line x1="-42" y1="15" x2="-22" y2="15" stroke="#1a1a1a" stroke-width="1.5"/>
    <line x1="32" y1="5" x2="32" y2="25" stroke="#1a1a1a" stroke-width="1.5"/>
    <line x1="22" y1="15" x2="42" y2="15" stroke="#1a1a1a" stroke-width="1.5"/>
    
    <!-- Door Handle -->
    <circle cx="8" cy="42" r="2" fill="#1a1a1a"/>
    
    <!-- Chimney -->
    <rect x="30" y="-45" width="12" height="30" 
          fill="#1a1a1a" 
          stroke="url(#goldGradient)" 
          stroke-width="2"/>
    
    <!-- Crown/Luxury Detail on Roof Peak -->
    <circle cx="0" cy="-70" r="6" 
            fill="url(#goldGradient)" 
            stroke="#ffd700" 
            stroke-width="1.5"
            filter="url(#glow)"/>
  </g>
  
  <!-- Subtle Corner Accents -->
  <path d="M 20 20 L 40 20 L 40 40" stroke="#d4af37" stroke-width="2" fill="none" opacity="0.3"/>
  <path d="M 236 20 L 216 20 L 216 40" stroke="#d4af37" stroke-width="2" fill="none" opacity="0.3"/>
  <path d="M 20 236 L 40 236 L 40 216" stroke="#d4af37" stroke-width="2" fill="none" opacity="0.3"/>
  <path d="M 236 236 L 216 236 L 216 216" stroke="#d4af37" stroke-width="2" fill="none" opacity="0.3"/>
</svg>

