<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded background with gold gradient border -->
  <rect width="200" height="200" fill="#000000" rx="40"/>
  
  <!-- Gold gradient border/frame -->
  <rect x="8" y="8" width="184" height="184" rx="32" fill="none" stroke="url(#borderGold)" stroke-width="4"/>
  
  <!-- Inner glow background -->
  <rect x="12" y="12" width="176" height="176" rx="28" fill="url(#bgGlow)"/>
  
  <defs>
    <!-- Border gold gradient -->
    <linearGradient id="borderGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#b8941f" />
    </linearGradient>
    
    <!-- Background glow -->
    <radialGradient id="bgGlow">
      <stop offset="0%" stop-color="#1a1507" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    
    <!-- Building gold - more vibrant -->
    <linearGradient id="buildingGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9e7" />
      <stop offset="30%" stop-color="#f4d58d" />
      <stop offset="70%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#c4a747" />
    </linearGradient>
    
    <!-- Window light -->
    <linearGradient id="windowLight">
      <stop offset="0%" stop-color="#fff9e6" />
      <stop offset="100%" stop-color="#f4d58d" />
    </linearGradient>
    
    <!-- Crown gradient -->
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffef5" />
      <stop offset="50%" stop-color="#f4d58d" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
  </defs>
  
  <g transform="translate(100, 105)">
    
    <!-- CROWN - Simplified and bold -->
    <g transform="translate(0, -62)">
      <!-- Crown glow -->
      <ellipse cx="0" cy="-4" rx="32" ry="10" fill="#d4af37" opacity="0.5"/>
      
      <!-- Crown shape - bolder -->
      <path 
        d="M -24 2 L -18 -10 L -12 -2 L 0 -16 L 12 -2 L 18 -10 L 24 2 Z" 
        fill="url(#crownGrad)" 
        stroke="#fef9e7" 
        stroke-width="2.5"
      />
      
      <!-- Crown jewels - larger -->
      <circle cx="-18" cy="-10" r="3.5" fill="#fffef5" stroke="#f4d58d" stroke-width="1"/>
      <circle cx="0" cy="-16" r="4.5" fill="#fffef5" stroke="#f4d58d" stroke-width="1"/>
      <circle cx="18" cy="-10" r="3.5" fill="#fffef5" stroke="#f4d58d" stroke-width="1"/>
    </g>

    <!-- MAIN TOWER - Simplified, bolder -->
    <g>
      <!-- Tower body - thicker -->
      <rect 
        x="-20" y="-55" width="40" height="100" 
        fill="url(#buildingGold)" 
        stroke="#fef3c7" 
        stroke-width="3"
        rx="3"
      />
      
      <!-- Top accent -->
      <rect x="-20" y="-55" width="40" height="8" fill="#fef9e7" opacity="0.4" rx="3"/>
      
      <!-- Simplified windows - larger, more visible -->
      <!-- Row 1 -->
      <rect x="-15" y="-42" width="10" height="8" fill="url(#windowLight)" rx="1" opacity="0.95"/>
      <rect x="5" y="-42" width="10" height="8" fill="#0a0a0a" rx="1" opacity="0.8"/>
      
      <!-- Row 2 -->
      <rect x="-15" y="-30" width="10" height="8" fill="#0a0a0a" rx="1" opacity="0.8"/>
      <rect x="5" y="-30" width="10" height="8" fill="url(#windowLight)" rx="1" opacity="0.95"/>
      
      <!-- Row 3 -->
      <rect x="-15" y="-18" width="10" height="8" fill="url(#windowLight)" rx="1" opacity="0.95"/>
      <rect x="5" y="-18" width="10" height="8" fill="#0a0a0a" rx="1" opacity="0.8"/>
      
      <!-- Row 4 -->
      <rect x="-15" y="-6" width="10" height="8" fill="#0a0a0a" rx="1" opacity="0.8"/>
      <rect x="5" y="-6" width="10" height="8" fill="url(#windowLight)" rx="1" opacity="0.95"/>
      
      <!-- Row 5 -->
      <rect x="-15" y="6" width="10" height="8" fill="url(#windowLight)" rx="1" opacity="0.95"/>
      <rect x="5" y="6" width="10" height="8" fill="url(#windowLight)" rx="1" opacity="0.95"/>
      
      <!-- Row 6 -->
      <rect x="-15" y="18" width="10" height="8" fill="#0a0a0a" rx="1" opacity="0.8"/>
      <rect x="5" y="18" width="10" height="8" fill="url(#windowLight)" rx="1" opacity="0.95"/>
      
      <!-- Row 7 -->
      <rect x="-15" y="30" width="10" height="8" fill="url(#windowLight)" rx="1" opacity="0.95"/>
      <rect x="5" y="30" width="10" height="8" fill="#0a0a0a" rx="1" opacity="0.8"/>

      <!-- Edge highlights -->
      <line x1="-20" y1="-53" x2="-20" y2="43" stroke="#fef9e7" stroke-width="2" opacity="0.7"/>
      <line x1="20" y1="-53" x2="20" y2="43" stroke="#fef9e7" stroke-width="2" opacity="0.7"/>
    </g>

    <!-- LEFT BUILDING - Simplified -->
    <g>
      <rect 
        x="-48" y="-25" width="24" height="70" 
        fill="url(#buildingGold)" 
        stroke="#f4d58d" 
        stroke-width="2.5"
        opacity="0.95"
        rx="2"
      />
      
      <!-- Top accent -->
      <rect x="-48" y="-25" width="24" height="6" fill="#fef9e7" opacity="0.3" rx="2"/>
      
      <!-- Larger windows -->
      <rect x="-42" y="-15" width="12" height="7" fill="url(#windowLight)" rx="1" opacity="0.9"/>
      <rect x="-42" y="-4" width="12" height="7" fill="#0a0a0a" rx="1" opacity="0.75"/>
      <rect x="-42" y="7" width="12" height="7" fill="url(#windowLight)" rx="1" opacity="0.9"/>
      <rect x="-42" y="18" width="12" height="7" fill="#0a0a0a" rx="1" opacity="0.75"/>
      <rect x="-42" y="29" width="12" height="7" fill="url(#windowLight)" rx="1" opacity="0.9"/>
      
      <!-- Edge highlight -->
      <line x1="-48" y1="-23" x2="-48" y2="43" stroke="#fef9e7" stroke-width="1.5" opacity="0.6"/>
    </g>

    <!-- RIGHT BUILDING - Simplified -->
    <g>
      <rect 
        x="24" y="-35" width="24" height="80" 
        fill="url(#buildingGold)" 
        stroke="#f4d58d" 
        stroke-width="2.5"
        opacity="0.95"
        rx="2"
      />
      
      <!-- Top accent -->
      <rect x="24" y="-35" width="24" height="6" fill="#fef9e7" opacity="0.3" rx="2"/>
      
      <!-- Larger windows -->
      <rect x="30" y="-25" width="12" height="7" fill="#0a0a0a" rx="1" opacity="0.75"/>
      <rect x="30" y="-14" width="12" height="7" fill="url(#windowLight)" rx="1" opacity="0.9"/>
      <rect x="30" y="-3" width="12" height="7" fill="url(#windowLight)" rx="1" opacity="0.9"/>
      <rect x="30" y="8" width="12" height="7" fill="#0a0a0a" rx="1" opacity="0.75"/>
      <rect x="30" y="19" width="12" height="7" fill="url(#windowLight)" rx="1" opacity="0.9"/>
      <rect x="30" y="30" width="12" height="7" fill="#0a0a0a" rx="1" opacity="0.75"/>
      
      <!-- Edge highlight -->
      <line x1="48" y1="-33" x2="48" y2="43" stroke="#fef9e7" stroke-width="1.5" opacity="0.6"/>
    </g>

    <!-- FOUNDATION - Bold and clear -->
    <rect 
      x="-52" y="45" width="104" height="6" 
      fill="url(#buildingGold)" 
      stroke="#fef3c7"
      stroke-width="2"
      rx="3"
    />
    
    <!-- Ground shadow -->
    <ellipse cx="0" cy="53" rx="60" ry="3" fill="#000" opacity="0.6"/>

  </g>
</svg>
