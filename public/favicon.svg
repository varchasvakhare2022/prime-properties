<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Dark Background with subtle gradient -->
  <rect width="512" height="512" fill="#0a0a0a" rx="96"/>
  <rect width="512" height="512" fill="url(#bgGradient)" rx="96" opacity="0.4"/>
  
  <!-- Gradients and Filters -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#c4941f;stop-opacity:0.15" />
    </linearGradient>
    
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c4941f;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff4d4;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c4941f;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Luxury House Icon - Centered and Large -->
  <g transform="translate(256, 256)">
    <!-- Roof with premium gradient -->
    <path d="M -120 -40 L 0 -140 L 120 -40 L 100 -40 L 100 -20 L -100 -20 L -100 -40 Z" 
          fill="url(#goldShine)" 
          stroke="#ffd700" 
          stroke-width="4"
          stroke-linejoin="round"
          filter="url(#strongGlow)"/>
    
    <!-- Roof highlight line -->
    <line x1="-80" y1="-60" x2="80" y2="-60" 
          stroke="#fff4d4" 
          stroke-width="3" 
          opacity="0.4"
          stroke-linecap="round"/>
    
    <!-- Main House Body -->
    <rect x="-100" y="-20" width="200" height="140" 
          fill="#1a1a1a" 
          stroke="url(#goldGradient)" 
          stroke-width="6"
          rx="4"/>
    
    <!-- House body inner shadow -->
    <rect x="-95" y="-15" width="190" height="130" 
          fill="none" 
          stroke="#0a0a0a" 
          stroke-width="2"
          rx="2"
          opacity="0.5"/>
    
    <!-- Door -->
    <rect x="-30" y="40" width="60" height="80" 
          fill="url(#goldShine)" 
          stroke="#ffd700"
          stroke-width="3"
          rx="4"
          filter="url(#glow)"/>
    
    <!-- Door panel details -->
    <rect x="-25" y="45" width="50" height="35" 
          fill="none" 
          stroke="#1a1a1a" 
          stroke-width="2"
          rx="2"
          opacity="0.3"/>
    <rect x="-25" y="85" width="50" height="30" 
          fill="none" 
          stroke="#1a1a1a" 
          stroke-width="2"
          rx="2"
          opacity="0.3"/>
    
    <!-- Windows - Left -->
    <rect x="-84" y="10" width="40" height="40" 
          fill="#d4af37" 
          stroke="#ffd700" 
          stroke-width="3"
          rx="2"
          filter="url(#glow)"
          opacity="0.95"/>
    
    <!-- Windows - Right -->
    <rect x="44" y="10" width="40" height="40" 
          fill="#d4af37" 
          stroke="#ffd700" 
          stroke-width="3"
          rx="2"
          filter="url(#glow)"
          opacity="0.95"/>
    
    <!-- Window Cross Bars - Left -->
    <line x1="-64" y1="10" x2="-64" y2="50" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    <line x1="-84" y1="30" x2="-44" y2="30" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Window Cross Bars - Right -->
    <line x1="64" y1="10" x2="64" y2="50" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    <line x1="44" y1="30" x2="84" y2="30" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Window reflections -->
    <rect x="-80" y="14" width="15" height="12" 
          fill="#fff4d4" 
          opacity="0.4"
          rx="1"/>
    <rect x="48" y="14" width="15" height="12" 
          fill="#fff4d4" 
          opacity="0.4"
          rx="1"/>
    
    <!-- Door Handle -->
    <circle cx="16" cy="84" r="4" fill="#1a1a1a"/>
    <circle cx="16" cy="84" r="3" fill="#d4af37" filter="url(#glow)"/>
    
    <!-- Chimney -->
    <rect x="60" y="-90" width="24" height="60" 
          fill="#1a1a1a" 
          stroke="url(#goldGradient)" 
          stroke-width="4"
          rx="2"/>
    
    <!-- Chimney cap -->
    <rect x="55" y="-94" width="34" height="8" 
          fill="url(#goldShine)" 
          stroke="#ffd700" 
          stroke-width="2"
          rx="2"
          filter="url(#glow)"/>
    
    <!-- Crown/Luxury Detail on Roof Peak -->
    <circle cx="0" cy="-140" r="12" 
            fill="url(#goldShine)" 
            stroke="#ffd700" 
            stroke-width="3"
            filter="url(#strongGlow)"/>
    
    <!-- Crown inner shine -->
    <circle cx="-3" cy="-143" r="5" 
            fill="#fff4d4" 
            opacity="0.6"/>
  </g>
  
  <!-- Elegant Corner Accents -->
  <path d="M 40 40 L 80 40 L 80 80" 
        stroke="url(#goldGradient)" 
        stroke-width="4" 
        stroke-linecap="round"
        fill="none" 
        opacity="0.4"/>
  <path d="M 472 40 L 432 40 L 432 80" 
        stroke="url(#goldGradient)" 
        stroke-width="4" 
        stroke-linecap="round"
        fill="none" 
        opacity="0.4"/>
  <path d="M 40 472 L 80 472 L 80 432" 
        stroke="url(#goldGradient)" 
        stroke-width="4" 
        stroke-linecap="round"
        fill="none" 
        opacity="0.4"/>
  <path d="M 472 472 L 432 472 L 432 432" 
        stroke="url(#goldGradient)" 
        stroke-width="4" 
        stroke-linecap="round"
        fill="none" 
        opacity="0.4"/>
  
  <!-- Subtle frame glow -->
  <rect width="512" height="512" 
        fill="none" 
        stroke="url(#goldGradient)" 
        stroke-width="2" 
        rx="96"
        opacity="0.2"/>
</svg>
